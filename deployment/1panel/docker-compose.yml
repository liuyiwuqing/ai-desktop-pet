name: nexus-production

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    pull_policy: missing
    env_file:
      - /etc/nexus/docker/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [backend]

  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    pull_policy: missing
    user: "1883:1883"
    read_only: true
    ports:
      - "8883:8883"
    volumes:
      - type: bind
        source: /etc/nexus/docker/mosquitto/config
        target: /mosquitto/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/nexus/docker/mosquitto/certs
        target: /mosquitto/certs
        read_only: true
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *bounded-logs
    networks: [backend, edge]

  core:
    image: ghcr.io/liuyiwuqing/nexus-core:sha-230c809670edab3800801d9135fde6465f190623
    platform: linux/amd64
    # 使用提前拉取或导入的镜像；缺失时直接报错，避免再次连接 GHCR。
    pull_policy: never
    env_file:
      - /etc/nexus/docker/core.env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:18088:8088"
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1g
    volumes:
      - type: bind
        source: /etc/nexus/docker/mosquitto/certs/ca.crt
        target: /etc/nexus/mqtt-ca.crt
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      mqtt: {condition: service_started}
    healthcheck:
      test: ["CMD", "java", "-Dloader.main=dev.nexus.core.runtime.ContainerHealthcheck", "-cp", "/app/core.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 4
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bounded-logs
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
