name: nexus-production

# 线上实例编排（由 1Panel 初始化镜像生成后按 CORE e76732b 升级）。
# 相对初始化版本的差异只有两处：core.image 换为已验证 digest，以及登录会话持久化所需的
# NEXUS_AUTH_SESSION_DIRECTORY + console-sessions 卷（服务级挂载与顶层声明各一处）。
# 其余服务、端口、只读根、cap_drop、健康检查与路径保持原样。

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    env_file:
      - /etc/nexus/docker/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [backend]

  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "1883:1883"
    read_only: true
    ports:
      - "${NEXUS_MQTT_BIND_ADDRESS:-0.0.0.0}:${NEXUS_MQTT_PORT:-8883}:8883"
    volumes:
      - type: bind
        source: /etc/nexus/docker/mosquitto/config
        target: /mosquitto/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/nexus/docker/mosquitto/certs
        target: /mosquitto/certs
        read_only: true
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *bounded-logs
    networks: [backend, edge]

  core:
    # e76732b 发布运行 44094002890 的 linux/amd64 镜像，由 docker save/load 导入。
    # 镜像 ID 必须是 sha256:aa3a2b56291ddf7b86bf38bdc63fc431e2433d5348012bb9c5c5dacec928c238。
    # 走 GHCR 在线拉取时，把本行换成 ghcr.io/liuyiwuqing/nexus-core@sha256:0310e7335b24bae830108f47001b18fdc195a47f8456ad47f977d0b96453ddba 并删掉 pull_policy。
    image: ghcr.io/liuyiwuqing/nexus-core:sha-e76732b3792313ea5f3744b09970a7972fc89a36
    pull_policy: never
    env_file:
      - /etc/nexus/docker/core.env
    environment:
      NEXUS_AUTH_SESSION_DIRECTORY: /var/lib/nexus/sessions
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "${NEXUS_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${NEXUS_CONSOLE_PORT:-18088}:8088"
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1g
    volumes:
      # 只读根文件系统下唯一可写的数据目录；缺失时登录写会话返回 503 session_store_unavailable。
      - console-sessions:/var/lib/nexus/sessions
      - type: bind
        source: /etc/nexus/docker/mosquitto/certs/ca.crt
        target: /etc/nexus/mqtt-ca.crt
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      mqtt: {condition: service_started}
    healthcheck:
      test: ["CMD", "java", "-Dloader.main=dev.nexus.core.runtime.ContainerHealthcheck", "-cp", "/app/core.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 4
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bounded-logs
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  console-sessions:
  postgres-data:
